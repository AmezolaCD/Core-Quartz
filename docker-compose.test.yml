# Postgres 16 desechable para las pruebas de la fase 02 (nunca Supabase).
#   docker compose -f docker-compose.test.yml up -d pg
#   npm run test:db
# Las pruebas leen DATABASE_URL_TEST (por omisión postgres://postgres@127.0.0.1:54329/postgres),
# así que sirven igual contra este contenedor o contra un Postgres local.
services:
  pg:
    image: postgres:16
    container_name: cq-pg-pruebas
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      TZ: America/Tijuana
    command: ["postgres", "-c", "max_connections=200"]
    ports:
      - "54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
